name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright and Chromium
        run: npm install -g playwright@1 && npx -y playwright@1 install --with-deps chromium
      - name: Run all checks
        run: tests/run.sh
