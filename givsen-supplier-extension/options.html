<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Givsen Supplier — Settings</title>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#f6f7f7;color:#1d2327;margin:0;padding:40px 20px}
  main{max-width:560px;margin:0 auto;background:#fff;border-radius:12px;padding:28px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
  h1{font-size:20px;margin:0 0 6px}
  p{color:#50575e;line-height:1.5;margin:0 0 18px}
  label{display:block;font-weight:600;font-size:13px;margin:14px 0 5px}
  input{width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid #c3c4c7;border-radius:8px;font-size:14px}
  button{margin-top:20px;background:#111;color:#fff;border:0;border-radius:8px;padding:11px 18px;font-size:14px;font-weight:600;cursor:pointer}
  button[disabled]{opacity:.6}
  #status{margin-top:16px;padding:11px 12px;border-radius:8px;font-size:14px;display:none}
  #status.ok{display:block;background:#edfaef;color:#1e6b34}
  #status.err{display:block;background:#fcf0f1;color:#b32d2e}
</style>
</head>
<body>
<main>
  <h1>Givsen Supplier</h1>
  <p>Copy both values from your store: <strong>WooCommerce → Givsen Supplier → Settings</strong>.</p>
  <label for="site">Site address</label>
  <input id="site" type="url" placeholder="https://givsen.com/" autocomplete="off">
  <label for="key">Connection key</label>
  <input id="key" type="password" placeholder="Paste the connection key" autocomplete="off">
  <button id="save" type="button">Save &amp; test</button>
  <div id="status" role="status"></div>
</main>
<script src="options.js"></script>
</body>
</html>
